name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev

      - name: Run lint
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev ruff check .

      - name: Run tests
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev python -m pytest

      - name: Compile importable Python sources
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev python -m compileall -q src scripts

  databricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package with the Databricks extra
        run: uv sync --locked --python 3.11 --extra dev --extra databricks

      - name: Run Databricks pipeline tests with CatBoost and MLflow
        run: uv run --locked --python 3.11 --extra dev --extra databricks python -m pytest tests/test_databricks_pipeline.py

      - name: Build the bundle wheel
        run: uv build --wheel

      - uses: databricks/setup-cli@main

      - name: Check bundle configuration against the CLI schema
        run: |
          databricks bundle schema > /tmp/bundle-schema.json
          uv run --locked --with jsonschema --with pyyaml python scripts/check_bundle_schema.py /tmp/bundle-schema.json

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform -chdir=infra/aws fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform -chdir=infra/aws init -backend=false

      - name: Validate configuration
        run: terraform -chdir=infra/aws validate

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production pipeline image
        run: >-
          docker build
          --build-arg GIT_SHA=${GITHUB_SHA}
          --file Dockerfile.pipeline
          --tag dk-energy-forecasts-pipeline:ci
          .

      - name: Verify container identity and provenance
        run: |
          test "$(docker run --rm --entrypoint id dk-energy-forecasts-pipeline:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint printenv dk-energy-forecasts-pipeline:ci DKENERGY_BUILD_GIT_SHA)" = "${GITHUB_SHA}"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' dk-energy-forecasts-pipeline:ci)" = "${GITHUB_SHA}"
          docker run --rm --entrypoint python dk-energy-forecasts-pipeline:ci -c \
            "import torch; assert torch.__version__.startswith('2.8.0'); assert torch.version.cuda is None"

      - name: Smoke-test pipeline command wiring
        run: >-
          docker run --rm
          dk-energy-forecasts-pipeline:ci
          pipeline
          --artifact-store-uri file:///tmp/cloud_store
          --model-artifact-uri file:///tmp/missing-model
          --workdir /tmp/runtime
          --dry-run
